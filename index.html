<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEYUR</title>
<style>

/* =========================================================
   BASE
========================================================= */

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Space Grotesk', sans-serif;
  color: white;
  background: #111;
  overflow-x: hidden;
}

section {
  position: relative;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background {
  position: fixed;
  inset: -3%;
  width: 106%;
  height: 106%;

  background:
    linear-gradient(
      rgba(0,0,0,0.38),
      rgba(0,0,0,0.50)
    ),
    url("https://images.unsplash.com/photo-1762378828467-b6798bd92562?auto=format&fit=crop&w=1920&q=85")
    center / cover no-repeat;

  z-index: -2;

  transform:
    translate3d(0,0,0)
    scale(1.025);

  will-change: transform;
}

.background-overlay {
  position: fixed;
  inset: 0;

  background:
    linear-gradient(
      rgba(0,0,0,0.16),
      rgba(0,0,0,0.30)
    );

  pointer-events: none;
  z-index: -1;
}


/* =========================================================
   CURSOR FOLLOWER
========================================================= */

.cursor-follower {
  position: fixed;

  width: 18px;
  height: 18px;

  border-radius: 50%;

  background: rgba(255,255,255,0.12);

  border: 1px solid rgba(255,255,255,0.45);

  box-shadow:
    0 0 14px rgba(255,255,255,0.18),
    inset 0 1px 2px rgba(255,255,255,0.25);

  pointer-events: none;
  z-index: 9999;

  transform:
    translate3d(-50%,-50%,0);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}


/* =========================================================
   FIXED NAVIGATION
========================================================= */

.nav {
  position: fixed;

  top: 50%;
  right: 24px;

  transform: translateY(-50%);

  width: 52px;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 8px;

  padding: 9px;

  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.28);

  border-radius: 18px;

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.22);

  z-index: 1000;
}

.nav-search {
  width: 100%;
  height: 34px;

  padding: 7px;

  box-sizing: border-box;

  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 10px;

  outline: none;

  background: rgba(255,255,255,0.08);

  color: white;

  font-size: 12px;

  text-align: center;

  transition:
    background 0.25s ease,
    border 0.25s ease;
}

.nav-search::placeholder {
  color: rgba(255,255,255,0.55);
}

.nav-search:focus {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.42);
}

.nav-divider {
  width: 26px;
  height: 1px;

  background: rgba(255,255,255,0.18);

  margin: 2px 0;
}

.nav-button {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: rgba(255,255,255,0.72);

  border-radius: 10px;

  text-decoration: none;

  transition:
    background 0.25s ease,
    color 0.25s ease,
    transform 0.25s ease;
}

.nav-button svg {
  width: 17px;
  height: 17px;

  fill: none;
  stroke: currentColor;

  stroke-width: 1.6;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-button:hover {
  background: rgba(255,255,255,0.15);
  color: white;

  transform: translateX(-3px);
}

.nav-button.active {
  background: rgba(255,255,255,0.16);
  color: white;
}


/* =========================================================
   GLASS SECTOR
========================================================= */

.glass-sector {
  position: relative;

  background: transparent;

  border: 1px solid rgba(255,255,255,0.32);

  backdrop-filter: none;
  -webkit-backdrop-filter: none;

  box-shadow: none;

  transform:
    perspective(1100px)
    rotateX(0deg)
    rotateY(0deg)
    translate3d(0,0,0);

  transform-origin: center center;

  will-change: transform;

  transition:
    transform 0.16s cubic-bezier(.18,.72,.28,1),
    border-color 0.3s ease;

  overflow: hidden;
}

.glass-sector::before,
.glass-sector::after {
  display: none;
}

.glass-sector > * {
  position: relative;
  z-index: 1;
}

.glass-sector.motion-active {
  background: transparent;

  border-color:
    rgba(255,255,255,0.42);

  box-shadow: none;
}


/* =========================================================
   PANEL 1 — IDENTITY
========================================================= */

.hero {
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 60px 20px;

  box-sizing: border-box;

  overflow: hidden;
}

.hero-title {
  width: min(1050px, calc(100% - 100px));

  padding: 70px 55px;

  text-align: center;

  box-sizing: border-box;
}


/* =========================================================
   HERO CONTENT
========================================================= */

.hero-title h1 {
  margin: 0;

  font-size: 44px;

  letter-spacing: 7px;

  display: flex;
  justify-content: center;
  overflow: hidden;
}

.hero-title h1 .hero-letter {
  display: inline-block;
  transform: translateY(115%);
  opacity: 0;
  animation: heroLetterRise 0.72s cubic-bezier(.18,.72,.28,1) forwards;
}

.hero-title h1 .hero-letter:nth-child(1) {
  animation-delay: 0.08s;
}

.hero-title h1 .hero-letter:nth-child(2) {
  animation-delay: 0.16s;
}

.hero-title h1 .hero-letter:nth-child(3) {
  animation-delay: 0.24s;
}

.hero-title h1 .hero-letter:nth-child(4) {
  animation-delay: 0.32s;
}

.hero-title h1 .hero-letter:nth-child(5) {
  animation-delay: 0.40s;
}

@keyframes heroLetterRise {
  from {
    transform: translateY(115%);
    opacity: 0;
  }

  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.hero-title p {
  margin: 12px 0 0;

  font-size: 20px;
}

.availability {
  display: flex;

  align-items: center;
  justify-content: center;

  gap: 9px;

  margin-top: 24px;

  color: rgba(255,255,255,0.78);

  font-size: 14px;

  letter-spacing: 0.5px;
}

.availability-dot {
  width: 9px;
  height: 9px;

  border-radius: 50%;

  background: #5cff72;

  box-shadow:
    0 0 9px rgba(92,255,114,0.65);
}


/* =========================================================
   NORGE CORE STRIP
========================================================= */

.norge-strip {
  position: relative;

  width: 100%;
  height: 54px;

  display: flex;
  align-items: center;

  overflow: hidden;

  background: rgba(255,255,255,0.07);

  border-top: 1px solid rgba(255,255,255,0.18);
  border-bottom: 1px solid rgba(255,255,255,0.18);

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.18),
    0 12px 30px rgba(0,0,0,0.20);
}

.norge-track {
  display: flex;

  width: max-content;

  white-space: nowrap;

  animation:
    norgeScroll 24s linear infinite;

  will-change: transform;
}

.norge-content {
  display: flex;
  align-items: center;

  flex-shrink: 0;
}

.norge-content span {
  display: inline-block;

  margin: 0 34px;

  font-size: 13px;

  letter-spacing: 4px;

  font-weight: bold;

  color: rgba(255,255,255,0.72);
}

.norge-content .separator {
  margin: 0 4px;

  font-size: 10px;

  color: rgba(255,255,255,0.35);
}

@keyframes norgeScroll {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }
}


/* =========================================================
   GENERAL SECTIONS
========================================================= */

.content-section {
  padding: 130px 20px;

  box-sizing: border-box;
}

.section-inner {
  width: min(1000px, calc(100% - 100px));

  margin: 0 auto;
}

.section-title {
  margin: 0 0 35px;

  font-size: 50px;

  letter-spacing: 1px;
}


/* =========================================================
   PANEL 2 — ABOUT ME
========================================================= */

.about-text {
  max-width: 820px;

  font-size: 19px;

  line-height: 1.8;

  color: #ddd;

  margin: 0;

  padding: 45px 50px;

  box-sizing: border-box;
}

.about-panel {
  border-radius: 25px;
}


/* =========================================================
   PANEL 3 — MY JOURNEY
========================================================= */

.journey-wrapper {
  width: 100%;
  overflow-x: auto;

  padding: 10px 4px 28px;

  box-sizing: border-box;

  scrollbar-width: thin;
  scrollbar-color:
    rgba(255,255,255,0.25)
    transparent;
}

.journey-wrapper::-webkit-scrollbar {
  height: 6px;
}

.journey-wrapper::-webkit-scrollbar-track {
  background: transparent;
}

.journey-wrapper::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.22);
  border-radius: 10px;
}

.glass-journey {
  width: max-content;
  min-width: 100%;

  padding: 55px 60px 70px;

  border-radius: 30px;

  box-sizing: border-box;

  overflow: hidden;
}

.glass-journey h2 {
  margin: 0 0 25px;

  font-size: 50px;
}

.glass-journey > p {
  max-width: 900px;

  margin: 0 0 45px;

  font-size: 19px;

  line-height: 1.7;

  color: #ddd;
}

.journey-track {
  display: flex;

  align-items: stretch;

  gap: 24px;

  width: max-content;

  position: relative;

  padding: 35px 5px 20px;
}

.journey-track::before {
  content: "";

  position: absolute;

  top: 13px;
  left: 20px;
  right: 20px;

  height: 1px;

  background:
    rgba(255,255,255,0.22);
}

.journey-entry {
  position: relative;

  width: 190px;
  min-height: 210px;

  padding: 28px 24px;

  box-sizing: border-box;

  border: 1px solid rgba(255,255,255,0.18);

  border-radius: 22px;

  background: transparent;

  transition:
    transform 0.25s ease,
    border-color 0.25s ease,
    background 0.25s ease;
}

.journey-entry:hover {
  transform: translateY(-5px);

  border-color:
    rgba(255,255,255,0.38);

  background:
    rgba(255,255,255,0.025);
}

/* =========================================================
   WEATHER
========================================================= */

const latitude = 19.0760;
const longitude = 72.8777;

const weatherURL =
  "https://api.open-meteo.com/v1/forecast" +
  "?latitude=" + latitude +
  "&longitude=" + longitude +
  "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code" +
  "&hourly=precipitation_probability" +
  "&forecast_days=1" +
  "&timezone=auto";

async function loadWeather() {
  const temperatureElement =
    document.getElementById("temperature");
  const conditionElement =
    document.getElementById("weather-condition");
  const weatherLine =
    document.getElementById("weatherLine");

  try {
    const response = await fetch(weatherURL);

    if (!response.ok) {
      throw new Error("Weather request failed (" + response.status + ")");
    }

    const data = await response.json();
    const current = data && data.current;

    if (
      !current ||
      typeof current.temperature_2m !== "number" ||
      typeof current.weather_code !== "number"
    ) {
      throw new Error("Weather response was missing current conditions");
    }

    temperatureElement.textContent =
      Math.round(current.temperature_2m) + "°C";

    conditionElement.textContent =
      getWeatherDescription(current.weather_code);

    const precipitation =
      data.hourly &&
      Array.isArray(data.hourly.precipitation_probability)
        ? data.hourly.precipitation_probability
        : [];

    const values = precipitation
      .slice(0, 13)
      .map(value => (
        typeof value === "number" && Number.isFinite(value)
          ? Math.max(0, Math.min(100, value))
          : null
      ));

    const validValues = values.filter(value => value !== null);

    if (weatherLine && validValues.length > 0) {
      const count = values.length;
      const points = values
        .map((value, index) => {
          const x = count > 1 ? (index / (count - 1)) * 500 : 250;
          // Keep the chart on a consistent 0–100% precipitation scale.
          const y = value === null ? null : 100 - value * 0.8;
          return y === null ? null : `${x},${y}`;
        })
        .filter(point => point !== null)
        .join(" ");

      if (points) {
        weatherLine.setAttribute("points", points);
      }
    }
  } catch (error) {
    temperatureElement.textContent = "Unavailable";
    conditionElement.textContent =
      "Weather data couldn't be loaded. Please try again later.";
    console.error("KEYUR weather loading failed:", error);
  }
}

loadWeather();

function getWeatherDescription(code) {
  if (code === 0) return "Clear sky";
  if (code === 1) return "Mainly clear";
  if (code === 2) return "Partly cloudy";
  if (code === 3) return "Overcast";
  if (code === 45 || code === 48) return "Foggy";
  if (code >= 51 && code <= 57) return "Drizzle";
  if (code >= 61 && code <= 67) return "Rainy";
  if (code >= 71 && code <= 77) return "Snowy";
  if (code >= 80 && code <= 82) return "Rain showers";
  if (code === 85 || code === 86) return "Snow showers";
  if (code === 95 || code === 96 || code === 99) return "Thunderstorm";
  return "Unknown conditions";
}

/* =========================================================
   NAVIGATION SEARCH
========================================================= */

const navSearch =
  document.getElementById(
    "navSearch"
  );


navSearch.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key !== "Enter"
    )
      return;

    const query =
      navSearch.value
        .trim()
        .toLowerCase();

    const destinations = {

      home:
        "home",

      about:
        "about",

      "about me":
        "about",

      journey:
        "journey",

      projects:
        "projects",

      project:
        "projects",

      identity:
        "identity",

      keyur:
        "identity"

    };

    if (
      destinations[query]
    ) {

      document
        .getElementById(
          destinations[query]
        )
        .scrollIntoView({
          behavior: "smooth"
        });

      navSearch.value =
        "";

    }

  }
);


/* =========================================================
   ACTIVE NAV ICON
========================================================= */

const navButtons =
  document.querySelectorAll(
    ".nav-button"
  );


const navSections = [

  document.getElementById(
    "identity"
  ),

  document.getElementById(
    "about"
  ),

  document.getElementById(
    "journey"
  ),

  document.getElementById(
    "home"
  ),

  document.getElementById(
    "projects"
  )

];


function updateActiveNav() {

  let current =
    navSections[0].id;

  navSections.forEach(
    section => {

      const rect =
        section.getBoundingClientRect();

      if (
        rect.top <=
        window.innerHeight * 0.45
      ) {

        current =
          section.id;

      }

    }
  );

  navButtons.forEach(
    button => {

      button.classList.remove(
        "active"
      );

      if (
        button.getAttribute(
          "href"
        ) ===
        "#" + current
      ) {

        button.classList.add(
          "active"
        );

      }

    }
  );

}


window.addEventListener(
  "scroll",
  updateActiveNav
);

updateActiveNav();


/* =========================================================
   NORGE CORE FEATURED PROJECT POPUP
========================================================= */

const norgePopup =
  document.getElementById(
    "norgePopup"
  );

const openNorgeButton =
  document.getElementById(
    "openNorgeButton"
  );

const norgePopupClose =
  document.getElementById(
    "norgePopupClose"
  );

const enterNorge =
  document.getElementById(
    "enterNorge"
  );


/*
   The destination is assembled here so the actual
   NORGE CORE address remains a single configurable value.
*/

const norgeCoreParts = [
  "https:",
  "",
  "keyurmadavi7-commits.github.io",
  "NORGE-CORE/"
];

const norgeCoreURL =
  norgeCoreParts.join("/");


enterNorge.href =
  norgeCoreURL;


/* =========================================================
   OPEN POPUP
========================================================= */

function openNorgePopup() {

  norgePopup.classList.add(
    "active"
  );

  norgePopup.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow =
    "hidden";

}


/* =========================================================
   CLOSE POPUP
========================================================= */

function closeNorgePopup() {

  norgePopup.classList.remove(
    "active"
  );

  norgePopup.setAttribute(
    "aria-hidden",
    "true"
  );

  document.body.style.overflow =
    "";

}


openNorgeButton.addEventListener(
  "click",
  openNorgePopup
);


norgePopupClose.addEventListener(
  "click",
  closeNorgePopup
);


/* =========================================================
   CLICK OUTSIDE POPUP
========================================================= */

norgePopup.addEventListener(
  "click",
  (event) => {

    if (
      event.target ===
      norgePopup
    ) {

      closeNorgePopup();

    }

  }
);


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Escape" &&
      norgePopup.classList.contains(
        "active"
      )
    ) {

      closeNorgePopup();

    }

  }
);

</script>
</body>
</html>
