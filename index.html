<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyur — Portfolio v1.2.3.8</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Landscape Wallpaper -->
  <div class="background" id="bg-wallpaper"></div>

  <!-- Dynamic iOS Weather Canvas Overlay -->
  <canvas id="weather-canvas"></canvas>

  <!-- Main Hero Layout -->
  <main class="hero-container">
    <div class="status-badge">
      <span class="status-dot">●</span>
      <span class="status-text">Available for Restoration</span>
    </div>

    <!-- Staggered clipped rise-up typography -->
    <h1 class="hero-title" aria-label="KEYUR">
      <span class="letter" style="--delay: 0.1s">K</span>
      <span class="letter" style="--delay: 0.2s">E</span>
      <span class="letter" style="--delay: 0.3s">Y</span>
      <span class="letter" style="--delay: 0.4s">U</span>
      <span class="letter" style="--delay: 0.5s">R</span>
    </h1>

    <!-- Norge Core Strip Continuous Ticker -->
    <div class="norge-strip">
      <div class="ticker-track">
        <span>NORGE CORE STRIP</span>
        <span class="sep">•</span>
        <span id="weather-status-display">SYNCING MUMBAI FORECAST...</span>
        <span class="sep">•</span>
        <span>SYSTEM ARCHITECTURE</span>
        <span class="sep">•</span>
        <span>RESTORED v1.2.3.8</span>
        <span class="sep">•</span>
        <span>NORGE CORE STRIP</span>
        <span class="sep">•</span>
        <span id="weather-status-display-dup">SYNCING MUMBAI FORECAST...</span>
        <span class="sep">•</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
