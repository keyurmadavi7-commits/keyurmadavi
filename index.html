<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard v1.2.3.9</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: #ffffff;
    }

    /* Background Layer */
    #bgLayerA {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      /* No transition rule here so background darkening updates instantly */
    }

    /* Layout Containers */
    .dashboard-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 80px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-icon {
      width: 44px;
      height: 44px;
      margin-bottom: 20px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .nav-icon:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Main Section */
    .main-content {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Weather Bar */
    .weather-widget {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px 24px;
      border-radius: 16px;
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .temp {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .condition {
      font-size: 1rem;
      opacity: 0.85;
    }

    /* Now Playing Widget */
    .now-playing-card {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 16px;
      width: 320px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .album-art {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .track-info {
      flex: 1;
    }

    .track-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .artist-name {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* Muted Waveform Visualizer */
    .audio-wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }

    .wave-bar {
      width: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      animation: wavePulse 1.2s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { height: 80%; animation-delay: 0.3s; }
    .wave-bar:nth-child(3) { height: 50%; animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

    @keyframes wavePulse {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }
  </style>
</head>
<body>

  <!-- Static Background Layer -->
  <div id="bgLayerA"></div>

  <div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="nav-icon">🏠</div>
      <div class="nav-icon">🎵</div>
      <div class="nav-icon">⚙️</div>
    </nav>

    <!-- Main Workspace -->
    <main class="main-content">
      <!-- Weather Header -->
      <div class="weather-widget">
        <span class="temp" id="temperature">--°C</span>
        <span class="condition" id="weather-condition">Checking weather...</span>
      </div>

      <!-- Now Playing Widget -->
      <div class="now-playing-card">
        <div class="album-art">🎵</div>
        <div class="track-info">
          <div class="track-title" id="track-title">Loading...</div>
          <div class="artist-name" id="artist-name">--</div>
        </div>
        <div class="audio-wave">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    /* =========================================================
       v1.2.3.9: INSTANT DARKENING & NOW PLAYING ROTATION
    ========================================================= */

    const WALLPAPER_URL = "https://images.unsplash.com/photo-1762378828467-b6798bd92562?q=80&w=1074&auto=format&fit=crop";

    // 1. INSTANT WALLPAPER DARKENING LOGIC
    function applyWallpaperDarkness(rainIntensity) {
      const bgLayer = document.getElementById('bgLayerA');
      if (!bgLayer) return;

      let overlayAlpha = 0.25; // Default / Clear

      if (rainIntensity === 'heavy') {
        overlayAlpha = 0.75; // Darkens heavily on rain
      } else if (rainIntensity === 'light') {
        overlayAlpha = 0.50; // Moderate dim on light rain
      }

      // Applied instantly without CSS transitions
      bgLayer.style.transition = 'none';
      bgLayer.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, ${overlayAlpha}), rgba(0, 0, 0, ${overlayAlpha})), url("${WALLPAPER_URL}")`;
    }

    // 2. NOW PLAYING ROTATION SYSTEM
    const sadPlaylist = [
      { title: "Glimpse of Us", artist: "Joji" },
      { title: "Chamber of Reflection", artist: "Mac DeMarco" },
      { title: "Something in the Way", artist: "Nirvana" },
      { title: "As It Was", artist: "Harry Styles" },
      { title: "Space Song", artist: "Beach House" },
      { title: "Sweater Weather", artist: "The Neighbourhood" }
    ];

    function updateNowPlaying() {
      const trackEl = document.getElementById('track-title');
      const artistEl = document.getElementById('artist-name');
      if (!trackEl || !artistEl) return;

      const today = new Date().getDay(); // 0 = Sun, 1 = Mon, 2 = Tue, 3 = Wed, etc.

      if (today === 3) {
        // Wednesday Special Track
        trackEl.textContent = "Golden Brown";
        artistEl.textContent = "The Stranglers";
      } else {
        // Rotates through playlist based on day index
        const song = sadPlaylist[today % sadPlaylist.length];
        trackEl.textContent = song.title;
        artistEl.textContent = song.artist;
      }
    }

    // 3. WEATHER FETCH ENGINE
    async function fetchMumbaiWeather() {
      const tempEl = document.getElementById('temperature');
      const condEl = document.getElementById('weather-condition');

      try {
        const API_KEY = "YOUR_OPENWEATHERMAP_API_KEY";
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Mumbai,IN&units=metric&appid=${API_KEY}`);
        
        if (!response.ok) throw new Error('API unreachable');

        const data = await response.json();
        const mainCond = data.weather[0].main.toLowerCase();
        const descCond = data.weather[0].description.toLowerCase();

        if (tempEl) tempEl.textContent = `${Math.round(data.main.temp)}°C`;
        if (condEl) condEl.textContent = data.weather[0].description.charAt(0).toUpperCase() + data.weather[0].description.slice(1);

        if (descCond.includes('heavy') || mainCond.includes('thunderstorm')) {
          applyWallpaperDarkness('heavy');
        } else if (mainCond.includes('rain') || descCond.includes('drizzle')) {
          applyWallpaperDarkness('light');
        } else {
          applyWallpaperDarkness('none');
        }
      } catch (err) {
        if (tempEl) tempEl.textContent = "29°C";
        if (condEl) condEl.textContent = "Heavy rain";
        applyWallpaperDarkness('heavy');
      }
    }

    // Initialize scripts
    document.addEventListener('DOMContentLoaded', () => {
      fetchMumbaiWeather();
      updateNowPlaying();
    });
  </script>
</body>
</html>
